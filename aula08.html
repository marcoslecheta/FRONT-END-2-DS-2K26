<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #121212;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif
        }

        .slider{
            position: relative;
            width: 100%;
            max-width: 600;
            aspect-ratio: 16/9;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0px 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .slider_input[type="radio"]{
            display: none;
        }

        .slides{
            display: flex;
            width: 300%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

    </style>

    <title>Slides html e css</title>
</head>
<body>
    
    <div class="slider">
        <input type="radio" name="contole" id="s1" checked>
        <input type="radio" name="contole" id="s2">
        <input type="radio" name="contole" id="s3">

        <div class="slides">
            <div class="slide">
                <h2>Slide 1</h2>
                <p>Exemplo de slide com html e css</p>
            </div>
        </div>
    </div>

        <div class="slides">
            <div class="slide">
                <h2>Slide 1</h2>
                <p>Exemplo de slide com html e css</p>
            </div>
        </div>
    </div>

        <div class="slides">
            <div class="slide">
                <h2>Slide 1</h2>
                <p>Exemplo de slide com html e css</p>
            </div>
        </div>
    </div>
    <div class="dots">
        <label for="s1"></label>
        <label for="s2"></label>
        <label for="s3"></label>
    </div>


</body>
</html>
